    <body>
        <h1>Titan wallet</h1>
        <script>
            var titanlib = {
                state: {},
                server_info: {},
                network: "regtest",
                backup_pubkey: "a".repeat( 64 ),
                am_server: false,
                listeners: {},
                hexToBytes: hex => Uint8Array.from( hex.match( /.{1,2}/g ).map( byte => parseInt( byte, 16 ) ) ),
                bytesToHex: bytes => bytes.reduce( ( str, byte ) => str + byte.toString( 16 ).padStart( 2, "0" ), "" ),
                getPrivkey: () => titanlib.bytesToHex( nobleSecp256k1.utils.randomPrivateKey() ),
                getPubkey: privkey => nobleSecp256k1.getPublicKey( privkey, true ).substring( 2 ),
                waitSomeTime: num => new Promise( resolve => setTimeout( resolve, num ) ),
                getAddressData: ( scripts, index ) => {
                    var tree = scripts.map( s => tapscript.Tap.encodeScript( s ) );
                    var [ tpubkey, cblock ] = tapscript.Tap.getPubKey( titanlib.backup_pubkey, { tree, target: tree[ index ] });
                    var address = tapscript.Address.p2tr.fromPubKey( tpubkey, titanlib.network );
                    return [ address, tree, cblock ];
                },
                sha256: async s => {
                    if ( typeof s == "string" ) s = new TextEncoder().encode( s );
                    var arr = await crypto.subtle.digest( 'SHA-256', s );
                    return titanlib.bytesToHex( new Uint8Array( arr ) );
                },
                hexToText: hex => {
                    var bytes = new Uint8Array( Math.ceil( hex.length / 2 ) );
                    var i; for ( i=0; i<hex.length; i++ ) bytes[ i ] = parseInt( hex.substr( i * 2, 2 ), 16 );
                    var text = new TextDecoder().decode( bytes );
                    return text;
                },
                textToHex: text => {
                    var encoded = new TextEncoder().encode( text );
                    return Array.from( encoded )
                        .map( x => x.toString( 16 ).padStart( 2, "0" ) )
                        .join( "" );
                },
                convertNEvent: nevent => {
                    var arr = bech32.bech32.fromWords( bech32.bech32.decode( nevent, 100_000 ).words );
                    var hex = titanlib.bytesToHex( arr );
                    if ( !hex.startsWith( "0020" ) ) var event_id = hex.substring( hex.length - 64 );
                    else var event_id = hex.substring( 4, 68 );
                    if ( !hex.startsWith( "0020" ) ) hex = hex.substring( 0, hex.length - 64 );
                    else hex = hex.substring( 68 );
                    var relays = [];
                    var loop = () => {
                        if ( hex.startsWith( "01" ) ) {
                            var relay_length = parseInt( hex.substring( 2, 4 ), 16 );
                            relays.push( titanlib.hexToText( hex.substring( 4, 4 + relay_length * 2 ) ) );
                            hex = hex.substring( 4 + relay_length * 2 );
                            loop();
                        }
                    }
                    loop();
                    return [ event_id, relays ];
                },
                convertPubkeyAndRelaysToNprofile: ( prefix, pubkey, relays ) => {
                    var relays_str = "";
                    relays.forEach( relay => {
                        var relay_str = titanlib.textToHex( relay );
                        var len = ( relay_str.length / 2 ).toString( 16 );
                        if ( len.length % 2 ) len = "0" + len;
                        relays_str = relays_str + "01" + len + relay_str;
                    });
                    var hex = relays_str + "0020" + pubkey;
                    var bytes = titanlib.hexToBytes( hex );
                    var nevent = bech32.bech32.encode( prefix, bech32.bech32.toWords( bytes ), 100_000 );
                    return nevent;
                },
                getBLScript: state_id => {
                    var state = titanlib.state[ state_id ];
                    var alices_pub = state.alices_pub;
                    var bobs_pub = state.bobs_pub;
                    return [
                        [ alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ],
                        //TODO: change the 6 to 2026
                        [ 6, "OP_CHECKSEQUENCEVERIFY", "OP_DROP", alices_pub, "OP_CHECKSIG",  ],
                    ];
                },
                init: async nprofile => {
                    var [ counterparty, relays ] = titanlib.convertNEvent( nprofile );
                    var state_id = "a_" + titanlib.getPrivkey().substring( 0, 16 );
                    var privkey = titanlib.getPrivkey();
                    var pubkey = titanlib.getPubkey( privkey );
                    titanlib.state[ state_id ] = {}
                    titanlib.state[ state_id ][ "alices_priv" ] = privkey;
                    titanlib.state[ state_id ][ "alices_pub" ] = pubkey;
                    titanlib.state[ state_id ][ "bobs_priv" ] = null;
                    titanlib.state[ state_id ][ "server_nostr_pubkey" ] = counterparty;
                    titanlib.state[ state_id ][ "relays" ] = relays;
                    titanlib.state[ state_id ][ "connector" ] = null;
                    titanlib.state[ state_id ][ "utxos" ] = [];
                    titanlib.state[ state_id ][ "past_utxos" ] = [];
                    titanlib.state[ state_id ][ "nostr_privkey" ] = super_nostr.getPrivkey();

                    var nostr_privkey = titanlib.state[ state_id ][ "nostr_privkey" ];
                    var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                    var relays = titanlib.state[ state_id ][ "relays" ];
                    var listenFunction = async socket => {
                        var subId = super_nostr.bytesToHex( crypto.getRandomValues( new Uint8Array( 8 ) ) );
                        var filter  = {}
                        filter.kinds = [ 4 ];
                        filter[ "#p" ] = [ nostr_pubkey ];
                        filter.since = Math.floor( Date.now() / 1000 ) - 5;
                        var subscription = [ "REQ", subId, filter ];
                        socket.send( JSON.stringify( subscription ) );
                    }
                    var handleFunction = async message => {
                        var [ type, subId, event ] = JSON.parse( message.data );
                        if ( !event || event === true ) return;
                        event.content = await super_nostr.alt_decrypt( nostr_privkey, event.pubkey, event.content );
                        var content = JSON.parse( event.content );
                        titanlib.listeners[ content.msg_type ] = content;
                    }
                    var connection = await super_nostr.newPermanentConnection( relays[ 0 ], listenFunction, handleFunction );

                    var message = JSON.stringify({
                        msg_type: "init",
                        msg_value: {
                            alices_pub: pubkey,
                            state_id,
                        },
                    });

                    //send message
                    var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                    var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                    super_nostr.sendEvent( event, relays[ 0 ] );
                    var message = await titanlib.listenForReply( "init_reply" );
                    // console.log( `send the following message to the server (they can process it using titanlib.processMessage):` );
                    // console.log( message );
                    // var message = JSON.parse( prompt( `send the message in your console to the server and enter their reply` ) );
                    console.log( message );

                    //process reply
                    if ( !message.msg_value.hasOwnProperty( "ack" ) || message.msg_value.ack !== true ) return alert( `error: ${JSON.stringify( reply.msg_value )}` );
                    titanlib.state[ state_id ][ "bobs_pub" ] = message.msg_value.bobs_pub;
                    return state_id;
                },
                runServer: async () => {
                    var nostr_privkey = titanlib.getPrivkey();
                    var nostr_pubkey = titanlib.getPubkey( nostr_privkey );
                    // var relays = [ "wss://nostrue.com" ];
                    var relays = [ "ws://127.0.0.1:6969" ];
                    titanlib.server_info[ "nostr_privkey" ] = nostr_privkey;
                    titanlib.server_info[ "nostr_pubkey" ] = nostr_pubkey;
                    titanlib.server_info[ "relays" ] = relays;
                    titanlib.server_info[ "utxos" ] = {};
                    titanlib.server_info[ "address" ] = tapscript.Address.fromScriptPubKey( [ 1, nostr_pubkey ], titanlib.network );
                    titanlib.am_server = true;
                    var listenFunction = async socket => {
                        var subId = super_nostr.bytesToHex( crypto.getRandomValues( new Uint8Array( 8 ) ) );
                        var filter  = {}
                        filter.kinds = [ 4 ];
                        filter[ "#p" ] = [ nostr_pubkey ];
                        filter.since = Math.floor( Date.now() / 1000 ) - 5;
                        var subscription = [ "REQ", subId, filter ];
                        socket.send( JSON.stringify( subscription ) );
                    }
                    var handleFunction = async message => {
                        var [ type, subId, event ] = JSON.parse( message.data );
                        if ( !event || event === true ) return;
                        event.content = await super_nostr.alt_decrypt( nostr_privkey, event.pubkey, event.content );
                        if ( JSON.parse( event.content ).msg_type === "receive_ln_part_two" || JSON.parse( event.content ).msg_type === "send_ln_part_two" ) {
                            titanlib.listeners[ JSON.parse( event.content ).msg_type ] = JSON.parse( event.content );
                            return;
                        }
                        titanlib.processMessage( JSON.parse( event.content ), event.pubkey );
                    }
                    var connection = await super_nostr.newPermanentConnection( relays[ 0 ], listenFunction, handleFunction );
                    //TODO: set up listener on nostr
                    return titanlib.convertPubkeyAndRelaysToNprofile( "nprofile", nostr_pubkey, relays );
                },
                isValidAddress: address => {
                    try {
                        return !!tapscript.Address.decode( address ).script;
                    } catch( e ) {return;}
                    return;
                },
                getVin: ( txid, vout, amnt, addy, sequence = 0xffffffff - 2 ) => ({
                    txid,
                    vout,
                    sequence,
                    prevout: {
                        value: amnt,
                        scriptPubKey: titanlib.isValidAddress( addy ) ? tapscript.Address.toScriptPubKey( addy ) : addy,
                    },
                }),
                getVout: ( amnt, addy ) => ({
                    value: amnt,
                    scriptPubKey: titanlib.isValidAddress( addy ) ? tapscript.Address.toScriptPubKey( addy ) : addy,
                }),
                getSwapScripts: ( state_id, pmthash ) => {
                    var state = titanlib.state[ state_id ];
                    var alices_pub = state.alices_pub;
                    var bobs_pub = state.bobs_pub;
                    return [
                        [ alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ],
                        [ "OP_SIZE", 32, "OP_EQUALVERIFY", "OP_SHA256", pmthash, "OP_EQUALVERIFY", alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ],
                    ];
                },
                subSwapScript: ( state_id, pmthash ) => {
                    var state = titanlib.state[ state_id ];
                    var alices_pub = state.alices_pub;
                    var bobs_pub = state.bobs_pub;
                    return [
                        //TODO: change the 7 to 2026
                        [ 7, "OP_CHECKSEQUENCEVERIFY", "OP_DROP", alices_pub, "OP_CHECKSIG" ],
                        [ "OP_SIZE", 32, "OP_EQUALVERIFY", "OP_SHA256", pmthash, "OP_EQUALVERIFY", bobs_pub, "OP_CHECKSIG" ],
                    ];
                },
                sendLN: async ( state_id, amount ) => {
                    //prepare requisite variables
                    var state = titanlib.state[ state_id ];
                    var alices_priv = state.alices_priv;
                    var alices_pub = state.alices_pub;
                    var bobs_pub = state.bobs_pub;
                    var make_connector = !state.connector_txid;
                    var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                    var alices_utxo = state.utxos[ 0 ];
                    //TODO: get the actual txfee from the mempool
                    var txfee = 500;

                    //enter what amount you want to receive
                    if ( !amount ) amount = Number( prompt( `enter the amount of sats you want to send` ) );
                    if ( !amount ) return;

                    //create a preimage and hash
                    var preimage = titanlib.getPrivkey();
                    console.log( 'preimage server gets upon paying the invoice:' );
                    console.log( preimage );
                    var pmthash = await titanlib.sha256( titanlib.hexToBytes( preimage ) );

                    //get swap data
                    var txs = titanlib.getSendTxData( state_id, amount, pmthash, alices_utxo, txfee );
                    var { funding_tx, cut_through_tx, alices_new_exit_tx, swap_scripts, swap_addy, swap_tree, swap_cblock, multisig_scripts, multisig_addy, multisig_tree, multisig_cblock } = txs;

                    //sign the funding tx and the cut_through tx
                    var old_pmthash = await titanlib.sha256( titanlib.hexToBytes( alices_utxo.preimage ) );
                    var old_swap_scripts = titanlib.getSwapScripts( state_id, old_pmthash );
                    var [ _, old_swap_tree, old_swap_cblock ] = titanlib.getAddressData( old_swap_scripts, 0 );
                    var alices_sig_on_funding_tx = tapscript.Signer.taproot.sign( alices_priv, funding_tx, 0, {extension: old_swap_tree[ 0 ]} ).hex;
                    var alices_sig_on_cut_through_tx = tapscript.Signer.taproot.sign( alices_priv, cut_through_tx, 0, {extension: multisig_tree[ 0 ] }).hex;

                    //give the server the pmthash, amount, and alice's sig on the funding tx
                    var message = JSON.stringify({
                        msg_type: "send_ln_part_one",
                        msg_value: {
                            state_id,
                            amount,
                            pmthash,
                            txfee,
                            alices_sig_on_funding_tx,
                        },
                    });

                    //send message
                    var counterparty = titanlib.state[ state_id ][ "server_nostr_pubkey" ];
                    var nostr_privkey = titanlib.state[ state_id ][ "nostr_privkey" ];
                    var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                    var relays = titanlib.state[ state_id ][ "relays" ];
                    var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                    var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                    super_nostr.sendEvent( event, relays[ 0 ] );
                    var message = await titanlib.listenForReply( "send_ln_part_one_reply" );
                    // console.log( 'send this message to your counterparty:' );
                    // console.log( message );
                    // var message = JSON.parse( prompt( `send the message in your console to your counterparty and enter their reply` ) );

                    //process counterparty's reply
                    var bobs_sig_on_new_exit_tx = message.msg_value.bobs_sig_on_new_exit_tx;
                    var preimage_provided = message.msg_value.preimage;
                    var hash_provided = await titanlib.sha256( titanlib.hexToBytes( preimage_provided ) );
                    var preimage_is_valid = hash_provided === pmthash;

                    //validate counterparty's sig
                    if ( bobs_sig_on_new_exit_tx.length !== 130 || !bobs_sig_on_new_exit_tx.endsWith( "82" ) ) return console.log( 'aborting because bob sent a sig of an invalid length' );
                    var b_sig = bobs_sig_on_new_exit_tx.substring( 0, 128 );
                    var sighash_on_new_exit_tx = tapscript.Signer.taproot.hash( alices_new_exit_tx, 0, {extension: multisig_tree[ 0 ], sigflag: 0x82} ).hex;
                    var bobs_sig_is_valid = await nobleSecp256k1.schnorr.verify( b_sig, sighash_on_new_exit_tx, bobs_pub );
                    if ( !bobs_sig_is_valid || !preimage_is_valid ) {
                        //TODO: actually force close
                        console.log( 'time to force close, your counterparty sent an invalid sig' );
                        return;
                    }

                    //reply with your own signature
                    var message = JSON.stringify({
                        msg_type: "send_ln_part_two",
                        msg_value: {
                            state_id,
                            alices_sig_on_cut_through_tx,
                        },
                    });

                    //send message
                    var counterparty = titanlib.state[ state_id ][ "server_nostr_pubkey" ];
                    var nostr_privkey = titanlib.state[ state_id ][ "nostr_privkey" ];
                    var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                    var relays = titanlib.state[ state_id ][ "relays" ];
                    var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                    var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                    super_nostr.sendEvent( event, relays[ 0 ] );
                    // console.log( 'send this message to your counterparty:' );
                    // console.log( message );

                    //TODO: automate this: watch to see if your counterparty broadcasts the cut-through tx, which they should do within a few seconds; if they do not, exit unilaterally NOT in the manner coded below, but using the titanlib.exitUnilaterally() method. And after doing so, and until you have fully exited, periodically check to see if the funding tx got broadcasted; that would constitute a race condition, in which case you *should* exit unilaterally in the manner displayed below
                    var funding_tx_was_broadcasted = confirm( `click ok if the funding_tx got broadcasted` );
                    if ( funding_tx_was_broadcasted ) {
                        //TODO: if your counterparty does not sweep the funds in the htlc via the preimage path, recover them using the timelock path -- and if he *does* sweep them via the preimage path, grab the preimage from the sweep tx and treat it as a proof-of-payment of the LN invoice you originally wished to pay
                    }

                    //move your old utxo data to past utxos, if necessary
                    if ( state.utxos.length ) {
                        var past_utxo = JSON.parse( JSON.stringify( state.utxos[ 0 ] ) );
                        //TODO: set a blockheight 10 blocks from now
                        var removable_at = 10;
                        past_utxo = { ...past_utxo, removable_at };
                        //TODO: set up a listener that watches to see if the server initiates a race condition by broadcasting the past utxo's version of tx1; if so, foil his attempt using the past utxo's version of tx4
                        state.past_utxos.push( past_utxo );
                        state.utxos.pop();
                    }

                    //save the info on your new utxo
                    state.utxos.push({
                        txid: tapscript.Tx.util.getTxid( cut_through_tx ),
                        vout: 1,
                        addy: multisig_addy,
                        amount: Number( cut_through_tx.vout[ 1 ].value ),
                        bobs_sig_on_new_exit_tx,
                        pmthash: "e0e77a507412b120f6ede61f62295b1a7b2ff19d3dcc8f7253e51663470c888e",
                        preimage: "a".repeat( 64 ),
                        alices_utxo,
                        txfee,
                    });

                    return true;
                },
                receiveLN: async ( state_id, amount ) => {
                    //prepare requisite variables
                    var state = titanlib.state[ state_id ];
                    var alices_priv = state.alices_priv;
                    var alices_pub = state.alices_pub;
                    var bobs_pub = state.bobs_pub;
                    var make_connector = !state.connector_txid;
                    var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                    var alices_utxo = state.utxos[ 0 ];

                    //enter what amount you want to receive
                    if ( !amount ) amount = Number( prompt( `enter the amount of sats you want to receive` ) );
                    if ( !amount ) return;

                    //prepare request
                    var message = JSON.stringify({
                        msg_type: "receive_ln_part_one",
                        msg_value: {
                            state_id,
                            amount,
                        },
                    });

                    //send message
                    var counterparty = titanlib.state[ state_id ][ "server_nostr_pubkey" ];
                    var nostr_privkey = titanlib.state[ state_id ][ "nostr_privkey" ];
                    var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                    var relays = titanlib.state[ state_id ][ "relays" ];
                    var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                    var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                    super_nostr.sendEvent( event, relays[ 0 ] );
                    var message = await titanlib.listenForReply( "receive_ln_part_one_reply" );
                    // console.log( 'send this message to your counterparty:' );
                    // console.log( message );
                    // var message = JSON.parse( prompt( `send the message in your console to your counterparty and enter their reply` ) );

                    //process the reply
                    //TODO: actually extract the pmthash
                    var pmthash = message.msg_value.invoice;
                    //TODO: ensure the txfee is reasonable based on what the mempool says
                    var { bobs_sig_on_tx3, bobs_sig_on_tx4, utxos, txfee } = message.msg_value

                    //TODO: validate the utxos

                    //validate that the amount matches what you expect
                    var sum = 0;
                    utxos.forEach( utxo => sum = sum + utxo.amnt );
                    var amnt_for_swap_addy = sum - txfee;
                    if ( make_connector ) amnt_for_swap_addy = amnt_for_swap_addy - 330;
                    if ( amnt_for_swap_addy < amount ) return console.log( `aborting because the server wants to send you ${amnt_for_swap_addy} sats when you asked for ${amount} sats` );

                    //add the user's utxos to the tx
                    state.utxos.forEach( utxo => utxos.push({ txid: utxo.txid, vout: utxo.vout, amnt: utxo.amount, addy: utxo.addy }) );

                    //modify the amount for the swap addy to include your own utxo contribution(s)
                    var sum_of_users_existing_utxos = 0;
                    state.utxos.forEach( utxo => sum_of_users_existing_utxos = sum_of_users_existing_utxos + utxo.amount );
                    var amount_for_swap_addy = amount + sum_of_users_existing_utxos;

                    //get the transactions that need to be signed
                    var txs = titanlib.getReceiveTxData( state_id, amount_for_swap_addy, pmthash, utxos, make_connector, txfee );
                    var { tx0, tx1, tx2, tx3, tx4, swap_scripts, swap_addy, swap_tree, swap_cblock } = txs;
                    if ( make_connector ) {
                        var tx0_txid = tapscript.Tx.util.getTxid( tx0 );
                        var connector_tx = tapscript.Tx.create({
                            version: 3,
                            vin: [
                                titanlib.getVin( tx0_txid, 1, 330, alices_address ),
                            ],
                            vout: [
                                titanlib.getVout( 330, alices_address ),
                                titanlib.getVout( 0, "51024e73" ),
                            ],
                        });
                        state.connector_txid = tapscript.Tx.util.getTxid( connector_tx );
                        state.connector_prev = tx0_txid;
                    }

                    //validate bob's signatures
                    if ( bobs_sig_on_tx3.length !== 130 || bobs_sig_on_tx4.length !== 130 || !bobs_sig_on_tx3.endsWith( "02" ) || !bobs_sig_on_tx4.endsWith( "82" ) ) return console.log( 'aborting because bob sent sigs of an invalid length' );
                    var sighash_for_tx3 = tapscript.Signer.taproot.hash( tx3, 1, {extension: swap_tree[ 1 ], sigflag: 0x02 }).hex;
                    var sig3 = bobs_sig_on_tx3.substring( 0, 128 );
                    var sig_on_tx3_is_valid = await nobleSecp256k1.schnorr.verify( sig3, sighash_for_tx3, bobs_pub );
                    var sighash_for_tx4 = tapscript.Signer.taproot.hash( tx4, 0, {extension: swap_tree[ 1 ], sigflag: 0x82 }).hex;
                    var sig4 = bobs_sig_on_tx4.substring( 0, 128 );
                    var sig_on_tx4_is_valid = await nobleSecp256k1.schnorr.verify( sig4, sighash_for_tx4, bobs_pub );
                    if ( !sig_on_tx3_is_valid || !sig_on_tx4_is_valid ) return console.log( 'aborting because bob sent invalid sigs:', sig_on_tx3_is_valid, sig_on_tx4_is_valid );

                    //sign tx0, tx1, tx2
                    if ( alices_utxo ) {
                        var old_pmthash = await titanlib.sha256( titanlib.hexToBytes( alices_utxo.preimage ) );

                            titanlib.getVin( state.connector_prev, 1, 330, alices_address ),
                        ],
                        vout: [
                            titanlib.getVout( amount, swap_addy ),
                            titanlib.getVout( alices_utxo.amount + 330 - amount - txfee, alices_address ),
                        ],
                    });

                    //prepare cut through tx
                    var cut_through_tx = tapscript.Tx.create({
                        vin: [
                            titanlib.getVin( alices_utxo.txid, alices_utxo.vout, alices_utxo.amount, alices_utxo.addy ),
                        ],
                        vout: [
                            titanlib.getVout( amount, bobs_address ),
                            titanlib.getVout( alices_utxo.amount - amount - txfee, multisig_addy ),
                        ],
                    });

                    //prepare alice's new exit tx
                    var alices_new_exit_tx = tapscript.Tx.create({
                        vin: [{
                            txid: tapscript.Tx.util.getTxid( cut_through_tx ),
                            vout: 1,
                            prevout: cut_through_tx.vout[ 1 ],
                        },
                            //TODO: change the 7 to 2026
                            titanlib.getVin( state.connector_txid, 1, 330, alices_address, 7 ),
                        ],
                        vout: [
                            titanlib.getVout( cut_through_tx.vout[ 1 ].value + 330, alices_address ),

                    //prepare the inputs for tx0
                    var vin = [];

                    utxos.forEach( utxo => {
                        sum = sum + utxo.amnt;

                        vin: [

                            titanlib.getVin( tx0_txid, 0, amount, swap_addy ),

                        vout: [
                            titanlib.getVout( amount, alices_address ),
                            titanlib.getVout( 0, "51024e73" ),
                        ],
                    });

                    //prepare tx4
                    var tx4 = tapscript.Tx.create({

                        vout: [
                            titanlib.getVout( amount, alices_address ),
                        ],
                    });

                    return { tx0, tx1, tx2, tx3, tx4, swap_scripts, swap_addy, swap_tree, swap_cblock };
                },

                                var utxos_to_use = [];
                                var loop = async () => {
                                    var utxos_i_have = Object.keys( titanlib.server_info.utxos );
                                    utxos_i_have.every( item => {
                                        var utxo = titanlib.server_info.utxos[ item ];
                                        utxos_to_use.push( utxo )
                                        var sum = 0;
                                        utxos_to_use.forEach( utxo => sum = sum + utxo.amnt );
                                        if ( sum < amount ) return true;
                                    });
                                    var sum = 0;
                                    utxos_to_use.forEach( utxo => sum = sum + utxo.amnt );

                                    //if you don't have enough utxos, tell the user to deposit sum
                                    if ( sum < amount ) {
                                        var addy = titanlib.server_info[ "address" ];
                                        console.log( `send ${amount - sum} or more sats to this address:` );
                                        console.log( addy );
                                        var txid = prompt( `send ${amount - sum} or more sats to the address in your console and enter the txid` );
                                        if ( txid.length !== 64 ) txid = "a".repeat( 64 );
                                        var vout = Number( prompt( `and the vout` ) );
                                        var amnt = Number( prompt( `and the amnt` ) );
                                        var priv = titanlib.server_info.nostr_privkey;
                                        var utxo_id = "s_" + titanlib.getPrivkey().substring( 0, 16 );
                                        titanlib.server_info.utxos[ utxo_id ] = {txid, vout, amnt, addy, priv, utxo_id, unspendable_til: 0};
                                        return loop();
                                    }
                                    return utxos_to_use;
                                }
                                return await loop();
                            }
                            var utxos_to_use = await findUtxos( amount_to_find_utxos_for );
                            var i_have_change = false;
                            var sum_of_utxos = 0;
                            utxos_to_use.forEach( utxo => sum_of_utxos = sum_of_utxos + utxo.amnt );
                            if ( sum_of_utxos - amount_to_find_utxos_for > 330 ) i_have_change = sum_of_utxos - amount_to_find_utxos_for;

                            //do not show the user the private keys to your utxos
                            var utxos_to_show = [];
                            utxos_to_use.forEach( item => {
                                var { txid, vout, amnt, addy } = item;
                                utxos_to_show.push({ txid, vout, amnt, addy });
                            });

                            //add the user's utxos to the tx
                            state.utxos.forEach( utxo => utxos_to_use.push({ txid: utxo.txid, vout: utxo.vout, amnt: utxo.amount, addy: utxo.addy }) );

                            //TODO: create a lightning invoice
                            //for now, I instead create a preimage and payment hash
                            var preimage = titanlib.getPrivkey();
                            console.log( 'preimage user gets upon paying the invoice:' );
                            console.log( preimage );
                            var pmthash = await titanlib.sha256( titanlib.hexToBytes( preimage ) );

                            //get the transactions that need to be signed
                            var txs = titanlib.getReceiveTxData( state_id, amount_for_swap_addy, pmthash, utxos_to_use, make_connector, txfee );
                            var { tx0, tx1, tx2, tx3, tx4, swap_scripts, swap_addy, swap_tree, swap_cblock } = txs;
                            if ( make_connector ) {
                                var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                                var tx0_txid = tapscript.Tx.util.getTxid( tx0 );
                                var connector_tx = tapscript.Tx.create({
                                    version: 3,
                                    vin: [
                                        titanlib.getVin( tx0_txid, 1, 330, alices_address ),
                                    ],
                                    vout: [
                                        titanlib.getVout( 330, alices_address ),
                                        titanlib.getVout( 0, "51024e73" ),
                                    ],
                                });
                                state.connector_txid = tapscript.Tx.util.getTxid( connector_tx );
                                state.connector_prev = tx0_txid;
                            }

                            //sign tx3 and tx4
                            var bobs_sig_on_tx3 = tapscript.Signer.taproot.sign( bobs_priv, tx3, 1, {extension: swap_tree[ 1 ], sigflag: 0x02 }).hex;
                            var bobs_sig_on_tx4 = tapscript.Signer.taproot.sign( bobs_priv, tx4, 0, {extension: swap_tree[ 1 ], sigflag: 0x82 }).hex;

                            //TODO: show the LN invoice, utxos, and sigs to the user
                            //for now, I show them the payment hash instead of the invoice
                            var message = JSON.stringify({
                                msg_type: "receive_ln_part_one_reply",
                                msg_value: {
                                    invoice: pmthash,
                                    utxos: utxos_to_show,
                                    txfee,
                                    bobs_sig_on_tx3,
                                    bobs_sig_on_tx4,
                                },
                            });

                            //send message
                            var nostr_privkey = titanlib.server_info.nostr_privkey;
                            var relays = titanlib.server_info.relays;
                            var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                            var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                            super_nostr.sendEvent( event, relays[ 0 ] );
                            // console.log( 'send this message to your counterparty:' );
                            // console.log( message );
                            // alert( 'send the message in your console to your counterparty, then click ok' );
                            await titanlib.waitSomeTime( 200 );
                            var message = await titanlib.listenForReply( "receive_ln_part_two" );
                            // var message = JSON.parse( prompt( `enter your counterparty's reply` ) );

                            //validate alice's signatures
                            var { alices_sig_on_tx0, alices_sig_on_tx1, alices_sig_on_tx2 } = message.msg_value;
                            if ( alices_utxo ) {
                                var old_pmthash = await titanlib.sha256( titanlib.hexToBytes( alices_utxo.preimage ) );
                                var old_swap_scripts = titanlib.getSwapScripts( state_id, old_pmthash );
                                var [ old_swap_addy, old_swap_tree, old_swap_cblock ] = titanlib.getAddressData( old_swap_scripts, 0 );
                                var sighash_for_tx0 = tapscript.Signer.taproot.hash( tx0, tx0.vin.length - 1, {extension: swap_tree[ 0 ] }).hex;
                                var sig_on_tx0_is_valid = await nobleSecp256k1.schnorr.verify( alices_sig_on_tx0, sighash_for_tx0, alices_pub );
                            } else {
                                var sig_on_tx0_is_valid = true;
                            }
                            if ( alices_sig_on_tx2.length !== 130 || !alices_sig_on_tx2.endsWith( "82" ) ) return console.log( 'aborting because alice sent a sig of an invalid length' );
                            var sighash_for_tx1 = tapscript.Signer.taproot.hash( tx1, 0, {extension: swap_tree[ 0 ] }).hex;
                            var sig_on_tx1_is_valid = await nobleSecp256k1.schnorr.verify( alices_sig_on_tx1, sighash_for_tx1, alices_pub );
                            var sighash_for_tx2 = tapscript.Signer.taproot.hash( tx2, 0, {extension: swap_tree[ 0 ], sigflag: 0x82 }).hex;
                            var sig2 = alices_sig_on_tx2.substring( 0, 128 );
                            var sig_on_tx2_is_valid = await nobleSecp256k1.schnorr.verify( sig2, sighash_for_tx2, alices_pub );
                            if ( !sig_on_tx0_is_valid || !sig_on_tx1_is_valid || !sig_on_tx2_is_valid ) return console.log( 'aborting because alice sent invalid sigs:', sig_on_tx0_is_valid, sig_on_tx1_is_valid, sig_on_tx2_is_valid );

                            //sign tx0
                            utxos_to_use.forEach( ( utxo, index ) => {
                                if ( !utxo.hasOwnProperty( "priv" ) ) return;
                                var sig = tapscript.Signer.taproot.sign( utxo.priv, tx0, index ).hex;
                                tx0.vin[ index ].witness = [ sig ];
                            });
                            if ( alices_utxo ) {
                                if ( state.utxos[ 0 ].hasOwnProperty( "alices_utxo" ) ) var [ _, _, old_swap_cblock ] = titanlib.getAddressData( [ [ alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ] ], 0 );
                                var bobs_sig_on_tx0 = tapscript.Signer.taproot.sign( bobs_priv, tx0, tx0.vin.length - 1, {extension: old_swap_tree[ 0 ]} ).hex;
                                tx0.vin[ tx0.vin.length - 1 ].witness = [ bobs_sig_on_tx0, alices_sig_on_tx0, old_swap_scripts[ 0 ], old_swap_cblock ];
                            }

                            //broadcast tx0
                            console.log( 'broadcast tx0:' );
                            console.log( tapscript.Tx.encode( tx0 ).hex );

                            //move the user's old utxo data to past utxos, if necessary
                            if ( state.utxos.length ) {
                                var past_utxo = JSON.parse( JSON.stringify( state.utxos[ 0 ] ) );
                                //TODO: set a blockheight 10 blocks from now
                                var removable_at = 10;
                                past_utxo = { ...past_utxo, removable_at };
                                state.past_utxos.push( past_utxo );
                                state.utxos.pop();
                            }

                            //save the info on the user's utxo
                            state.utxos.push({
                                txid: tapscript.Tx.util.getTxid( tx0 ),
                                vout: 0,
                                addy: swap_addy,
                                amount: amount_for_swap_addy,
                                alices_sig_on_tx1,
                                alices_sig_on_tx2,
                                preimage,
                                make_connector,
                                utxos: utxos_to_use,
                                txfee,
                            });

                            //save the server's utxo data
                            utxos_to_remove = [];
                            utxos_to_use.forEach( item => {
                                if ( item.hasOwnProperty( "utxo_id" ) ) utxos_to_remove.push( item.utxo_id );
                            });
                            utxos_to_remove.forEach( item => delete titanlib.server_info.utxos[ item ] );
                            var utxo_id = "s_" + titanlib.getPrivkey().substring( 0, 16 );
                            //TODO: ensure the utxo is marked unspendable til a few blocks after tx0 confirms
                            if ( i_have_change ) titanlib.server_info.utxos[ utxo_id ] = {txid: tapscript.Tx.util.getTxid( tx0 ), vout: make_connector ? 2 : 1, amnt: i_have_change, addy: bobs_address, priv: bobs_priv, utxo_id, unspendable_til: 5}

                            state.blocked_from_receiving = false;

                            //try to recover your money?
                            await titanlib.waitSomeTime( 200 );
                            var conf = confirm( `click ok to try to recover your money` );
                            if ( !conf ) return;

                            //get money to pay for tx1
                            var addy = tapscript.Address.fromScriptPubKey( [ 1, bobs_pub ] );
                            console.log( `send 1500 or more sats to this address:` );
                            console.log( addy );
                            var txid = prompt( `send 1500 or more sats to the address in your console and enter the txid` );
                            var vout = Number( prompt( `and the vout` ) );
                            var amnt = Number( prompt( `and the amnt` ) );
                            var priv = titanlib.server_info.nostr_privkey;

                            //create the needed exit txs
                            var tx1_txid = tapscript.Tx.util.getTxid( tx1 );
                            var exit_tx_1 = tapscript.Tx.create({
                                version: 3,
                                vin: [
                                    titanlib.getVin( tx1_txid, 1, 0, "51024e73" ),
                                    titanlib.getVin( txid, vout, amnt, addy ),
                                ],
                                vout: [
                                    //on this tx I pay double txfees because it throws an error otherwise,
                                    //saying I paid too low a fee
                                    titanlib.getVout( amnt - txfee - txfee, addy ),
                                ],
                            });
                            var exit_tx_1_txid = tapscript.Tx.util.getTxid( exit_tx_1 );
                            tx2.vin.push( titanlib.getVin( exit_tx_1_txid, 0, amnt - txfee - txfee, addy ) );

                            //sign tx1, exit_tx_1, and tx2
                            var [ _, _, swap_cblock ] = titanlib.getAddressData( swap_scripts, 0 );
                            var sig_on_tx1 = tapscript.Signer.taproot.sign( bobs_priv, tx1, 0, {extension: swap_tree[ 0 ] });
                            tx1.vin[ 0 ].witness = [ sig_on_tx1, alices_sig_on_tx1, swap_scripts[ 0 ], swap_cblock ];
                            var sig_on_exit_tx_1 = tapscript.Signer.taproot.sign( bobs_priv, exit_tx_1, 1 );
                            exit_tx_1.vin[ 1 ].witness = [ sig_on_exit_tx_1 ];
                            var first_sig_on_tx2 = tapscript.Signer.taproot.sign( bobs_priv, tx2, 0, {extension: swap_tree[ 0 ] });
                            tx2.vin[ 0 ].witness = [ first_sig_on_tx2, alices_sig_on_tx2, swap_scripts[ 0 ], swap_cblock ];
                            var second_sig_on_tx2 = tapscript.Signer.taproot.sign( bobs_priv, tx2, 1 );
                            tx2.vin[ 1 ].witness = [ second_sig_on_tx2 ];

                            //broadcast the transactions
                            console.log( 'broadcast tx1:' );
                            console.log( tapscript.Tx.encode( tx1 ).hex );
                            console.log( 'broadcast exit_tx_1:' );
                            console.log( tapscript.Tx.encode( exit_tx_1 ).hex );
                            console.log( 'wait 2016 blocks (but for testing purposes it is only 6)' );
                            console.log( 'broadcast tx2:' );
                            console.log( tapscript.Tx.encode( tx2 ).hex );
                            alert( 'broadcast the transactions in your console, in this order: tx1 and exit_tx_1 as a package; then wait 2016 blocks (but for testing purposes it is only 6); then tx2' );
                        }
                        if ( message.msg_type === "send_ln_part_one" ) {
                            //prepare the requisite variables
                            var state = titanlib.state[ state_id ];
                            if ( state.blocked_from_sending ) {
                                var loop = async () => {
                                    await titanlib.waitSomeTime( 100 );
                                    if ( state.blocked_from_sending ) return loop();
                                }
                                await loop();
                            }
                            state.blocked_from_sending = true;
                            var bobs_priv = state.bobs_priv;
                            var alices_pub = state.alices_pub;
                            var bobs_pub = state.bobs_pub;
                            var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                            var bobs_address = tapscript.Address.fromScriptPubKey( [ 1, bobs_pub ], titanlib.network );
                            var amount = message.msg_value.amount;
                            var pmthash = message.msg_value.pmthash;
                            if ( amount < 1500 ) return console.log( 'aborting: sender tried to send too little' );
                            var alices_utxo = state.utxos[ 0 ];
                            //TODO: use the mempool to check if the txfee is reasonable
                            var txfee = message.msg_value.txfee;

                            //get swap data
                            var txs = titanlib.getSendTxData( state_id, amount, pmthash, alices_utxo, txfee );
                            var { funding_tx, cut_through_tx, alices_new_exit_tx, swap_scripts, swap_addy, swap_tree, swap_cblock, multisig_scripts, multisig_addy, multisig_tree, multisig_cblock } = txs;

                            //validate alice's sig
                            var alices_sig_on_funding_tx = message.msg_value.alices_sig_on_funding_tx;
                            var old_pmthash = await titanlib.sha256( titanlib.hexToBytes( alices_utxo.preimage ) );
                            var old_swap_scripts = titanlib.getSwapScripts( state_id, old_pmthash );
                            var [ _, old_swap_tree, old_swap_cblock ] = titanlib.getAddressData( old_swap_scripts, 0 );
                            var funding_tx_sighash = tapscript.Signer.taproot.hash( funding_tx, 0, {extension: old_swap_tree[ 0 ]} ).hex;
                            var alices_sig_is_valid = await nobleSecp256k1.schnorr.verify( alices_sig_on_funding_tx, funding_tx_sighash, alices_pub );
                            if ( !alices_sig_is_valid ) return console.log( 'aborting: sender sent invalid sig' );

                            //sign cut_through_tx and alices_new_exit_tx
                            var bobs_sig_on_cut_through_tx = tapscript.Signer.taproot.sign( bobs_priv, cut_through_tx, 0, {extension: multisig_tree[ 0 ] }).hex;
                            var bobs_sig_on_new_exit_tx = tapscript.Signer.taproot.sign( bobs_priv, alices_new_exit_tx, 0, {extension: multisig_tree[ 0 ], sigflag: 0x82 }).hex;

                            //TODO: pay the lightning invoice
                            //TODO: ensure Alice has not yet made her connector
                            var preimage = prompt( `enter the preimage from paying an ln invoice for the user` );

                            //send alice the sig on her new exit tx and the preimage
                            var message = JSON.stringify({
                                msg_type: "send_ln_part_one_reply",
                                msg_value: {
                                    bobs_sig_on_new_exit_tx,
                                    preimage,
                                }
                            });
                            var nostr_privkey = titanlib.server_info.nostr_privkey;
                            var relays = titanlib.server_info.relays;
                            var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                            var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                            super_nostr.sendEvent( event, relays[ 0 ] );
                            // console.log( 'send this message to your counterparty:' );
                            // console.log( message );
                            // alert( 'send the message in your console to your counterparty, then click ok' );

                            //process counterparty's reply
                            await titanlib.waitSomeTime( 200 );
                            var message = await titanlib.listenForReply( "send_ln_part_two" );
                            // var message = JSON.parse( prompt( `enter your counterparty's reply` ) );

                            //validate counterparty's cut-through sig
                            var alices_sig_on_cut_through_tx = message.msg_value.alices_sig_on_cut_through_tx;
                            var cut_through_sighash = tapscript.Signer.taproot.hash( cut_through_tx, 0, {extension: multisig_tree[ 0 ] }).hex;
                            var alices_sig_is_valid = await nobleSecp256k1.schnorr.verify( alices_sig_on_cut_through_tx, cut_through_sighash, alices_pub );
                            var skip_cut_through = false;
                            if ( !alices_sig_is_valid ) skip_cut_through = true;

                            if ( !skip_cut_through ) skip_cut_through = confirm( `click ok to skip the cut-through (only do this to test the unhappy path)` );
                            if ( skip_cut_through ) {
                                //broadcast the cut-through tx
                                console.log( 'we are skipping the cut through tx' );
                                //broadcast the funding tx and sweeping the funds
                                var bobs_sig_on_funding_tx = tapscript.Signer.taproot.sign( bobs_priv, funding_tx, 0, {extension: old_swap_tree[ 0 ]} ).hex;
                                funding_tx.vin[ 0 ].witness = [ bobs_sig_on_funding_tx, alices_sig_on_funding_tx, old_swap_scripts[ 0 ], old_swap_cblock ];

                                var sweep_tx = tapscript.Tx.create({
                                    vin: [{
                                        txid: tapscript.Tx.util.getTxid( funding_tx ),
                                        vout: 0,
                                        prevout: funding_tx.vout[ 0 ],
                                    }],
                                    vout: [
                                        titanlib.getVout( amount - txfee, bobs_address ),
                                    ],
                                });
                                var bobs_sig_on_sweep_tx = tapscript.Signer.taproot.sign( bobs_priv, sweep_tx, 0, {extension: swap_tree[ 1 ]} ).hex;
                                sweep_tx.vin[ 0 ].witness = [ bobs_sig_on_sweep_tx, preimage, swap_scripts[ 1 ], swap_cblock ];

                                var funding_txhex = tapscript.Tx.encode( funding_tx ).hex;
                                var sweep_txhex = tapscript.Tx.encode( sweep_tx ).hex;
                                console.log( 'broadcast this:' );
                                console.log( funding_txhex );
                                console.log( 'and this:' );
                                console.log( sweep_txhex );
                            }

                            //broadcast the cut_through tx
                            cut_through_tx.vin[ 0 ].witness = [ bobs_sig_on_cut_through_tx, alices_sig_on_cut_through_tx, old_swap_scripts[ 0 ], old_swap_cblock ];
                            console.log( 'broadcast this:' );
                            console.log( tapscript.Tx.encode( cut_through_tx ).hex );
                            state.blocked_from_sending = false;
                            alert( 'broadcast the tx in your console' );

                            //move the user's old utxo data to past utxos, if necessary
                            if ( state.utxos.length ) {
                                var past_utxo = JSON.parse( JSON.stringify( state.utxos[ 0 ] ) );
                                //TODO: set a blockheight 10 blocks from now
                                var removable_at = 10;
                                past_utxo = { ...past_utxo, removable_at };
                                //TODO: set up a listener that watches to see if the server initiates a race condition by broadcasting the past utxo's version of tx1; if so, foil his attempt using the past utxo's version of tx4
                                state.past_utxos.push( past_utxo );
                                state.utxos.pop();
                            }

                            //save the info on the user's new utxo
                            state.utxos.push({
                                txid: tapscript.Tx.util.getTxid( cut_through_tx ),
                                vout: 1,
                                addy: multisig_addy,
                                amount: Number( cut_through_tx.vout[ 1 ].value ),
                                pmthash: "e0e77a507412b120f6ede61f62295b1a7b2ff19d3dcc8f7253e51663470c888e",
                                preimage: "a".repeat( 64 ),
                                alices_utxo,
                                txfee,
                            });
                        }
                    } else {
                        var state_id = "a_" + message.msg_value.state_id.substring( 2 );
                    }
                },
                listenForReply: async identifier => {
                    if ( titanlib.listeners.hasOwnProperty( identifier ) ) {
                        var returnable = JSON.parse( JSON.stringify( titanlib.listeners[ identifier ] ) );
                        delete titanlib.listeners[ identifier ];
                        return returnable;
                    }
                    await titanlib.waitSomeTime( 100 );
                    return titanlib.listenForReply( identifier );
                },
                getBalance: state_id => titanlib.state[ state_id ].utxos[ 0 ].amount,
                runTests: async () => {
                    var nprofile = await titanlib.runServer();
                    var state_id = await titanlib.init( nprofile );
                    var amount_to_receive = 10_000;
                    var receive_worked = await titanlib.receiveLN( state_id, amount_to_receive );
                    console.log( 'receive worked, right?', receive_worked );
                    console.log( `user's balance:`, titanlib.getBalance( state_id ) );
                    await titanlib.waitSomeTime( 1000 );
                    var amount_to_receive = 15_000;
                    var receive_worked = await titanlib.receiveLN( state_id, amount_to_receive );
                    console.log( 'receive worked again, right?', receive_worked );
                    console.log( `user's balance:`, titanlib.getBalance( state_id ) );
                    await titanlib.waitSomeTime( 1000 );
                    var amount_to_send = 4_000;
                    var send_worked = await titanlib.sendLN( state_id, amount_to_send );
                    console.log( 'sending worked, right?', send_worked );
                    console.log( `user's balance:`, titanlib.getBalance( state_id ) );
                    await titanlib.waitSomeTime( 1000 );
                    var amount_to_send = 8_000;
                    var send_worked = await titanlib.sendLN( state_id, amount_to_send );
                    console.log( 'sending worked again, right?', send_worked );
                    console.log( `user's balance:`, titanlib.getBalance( state_id ) );
                    await titanlib.waitSomeTime( 1000 );
                    var amount_to_receive = 19_000;
                    var receive_worked = await titanlib.receiveLN( state_id, amount_to_receive );
                    console.log( 'receive worked again, right?', receive_worked );
                    console.log( `user's balance:`, titanlib.getBalance( state_id ) );
                },
            }
        </script>
