<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <title>Brick Wallet</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://supertestnet.github.io/brick-wallet/favicon.ico">
    <script src="https://cdn.jsdelivr.net/gh/mebjas/html5-qrcode@master/minified/html5-qrcode.min.js"></script>
    <script src="https://supertestnet.github.io/bitcoin-chess/js/qrcode.js"></script>
    <script src="https://supertestnet.github.io/bitcoin-chess/js/bolt11.js"></script>
    <script src="https://supertestnet.github.io/bankify/super_nostr.js"></script>
    <script src="https://supertestnet.github.io/nwcjs/nwcjs.js"></script>
    <script src="https://unpkg.com/@cmdcode/tapscript@1.5.3"></script>
    <script src="https://bundle.run/browserify-cipher@1.0.1"></script>
    <script src="https://bundle.run/noble-secp256k1@1.2.14"></script>
    <script src="https://bundle.run/bech32@2.0.0"></script>
    <script>
        var titanlib = {
            state: {},
            server_info: {},
            network: "testnet",
            blockchain: "testnet4/",
            explorer: "mempool.emzy.de",
            backup_pubkey: "a".repeat( 64 ),
            am_server: false,
            listeners: {},
            nwc_timeout: 20,
            hexToBytes: hex => Uint8Array.from( hex.match( /.{1,2}/g ).map( byte => parseInt( byte, 16 ) ) ),
            bytesToHex: bytes => bytes.reduce( ( str, byte ) => str + byte.toString( 16 ).padStart( 2, "0" ), "" ),
            getPrivkey: () => titanlib.bytesToHex( nobleSecp256k1.utils.randomPrivateKey() ),
            getPubkey: privkey => nobleSecp256k1.getPublicKey( privkey, true ).substring( 2 ),
            waitSomeTime: num => new Promise( resolve => setTimeout( resolve, num ) ),
            getAddressData: ( scripts, index ) => {
                var tree = scripts.map( s => tapscript.Tap.encodeScript( s ) );
                var [ tpubkey, cblock ] = tapscript.Tap.getPubKey( titanlib.backup_pubkey, { tree, target: tree[ index ] });
                var address = tapscript.Address.p2tr.fromPubKey( tpubkey, titanlib.network );
                return [ address, tree, cblock ];
            },
            sha256: async s => {
                if ( typeof s == "string" ) s = new TextEncoder().encode( s );
                var arr = await crypto.subtle.digest( 'SHA-256', s );
                return titanlib.bytesToHex( new Uint8Array( arr ) );
            },
            hexToText: hex => {
                var bytes = new Uint8Array( Math.ceil( hex.length / 2 ) );
                var i; for ( i=0; i<hex.length; i++ ) bytes[ i ] = parseInt( hex.substr( i * 2, 2 ), 16 );
                var text = new TextDecoder().decode( bytes );
                return text;
            },
            textToHex: text => {
                var encoded = new TextEncoder().encode( text );
                return Array.from( encoded )
                    .map( x => x.toString( 16 ).padStart( 2, "0" ) )
                    .join( "" );
            },
            convertNEvent: nevent => {
                var arr = bech32.bech32.fromWords( bech32.bech32.decode( nevent, 100_000 ).words );
                var hex = titanlib.bytesToHex( arr );
                if ( !hex.startsWith( "0020" ) ) var event_id = hex.substring( hex.length - 64 );
                else var event_id = hex.substring( 4, 68 );
                if ( !hex.startsWith( "0020" ) ) hex = hex.substring( 0, hex.length - 64 );
                else hex = hex.substring( 68 );
                var relays = [];
                var loop = () => {
                    if ( hex.startsWith( "01" ) ) {
                        var relay_length = parseInt( hex.substring( 2, 4 ), 16 );
                        relays.push( titanlib.hexToText( hex.substring( 4, 4 + relay_length * 2 ) ) );
                        hex = hex.substring( 4 + relay_length * 2 );
                        loop();
                    }
                }
                loop();
                return [ event_id, relays ];
            },
            convertPubkeyAndRelaysToNprofile: ( prefix, pubkey, relays ) => {
                var relays_str = "";
                relays.forEach( relay => {
                    var relay_str = titanlib.textToHex( relay );
                    var len = ( relay_str.length / 2 ).toString( 16 );
                    if ( len.length % 2 ) len = "0" + len;
                    relays_str = relays_str + "01" + len + relay_str;
                });
                var hex = relays_str + "0020" + pubkey;
                var bytes = titanlib.hexToBytes( hex );
                var nevent = bech32.bech32.encode( prefix, bech32.bech32.toWords( bytes ), 100_000 );
                return nevent;
            },
            getBLScript: state_id => {
                var state = titanlib.state[ state_id ];
                var alices_pub = state.alices_pub;
                var bobs_pub = state.bobs_pub;
                return [
                    [ alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ],
                    //change the 2026 to 8 for testing purposes
                    [ 2026, "OP_CHECKSEQUENCEVERIFY", "OP_DROP", alices_pub, "OP_CHECKSIG",  ],
                ];
            },
            init: async ( nprofile, make_new_state ) => {
                if ( Object.keys( titanlib.state ).length ) {
                    var state_id = Object.keys( titanlib.state )[ 0 ];
                    if ( !state_id.startsWith( "a" ) ) state_id = Object.keys( titanlib.state )[ 1 ];
                }
                if ( make_new_state ) {
                    Object.keys( titanlib.state ).forEach( item => {
                        if ( item.startsWith( "a" ) ) delete titanlib.state[ item ];
                    });
                    var [ counterparty, relays ] = titanlib.convertNEvent( nprofile );
                    var state_id = "a_" + titanlib.getPrivkey().substring( 0, 16 );
                    var privkey = titanlib.getPrivkey();
                    var pubkey = titanlib.getPubkey( privkey );
                    titanlib.state[ state_id ] = {}
                    titanlib.state[ state_id ][ "alices_priv" ] = privkey;
                    titanlib.state[ state_id ][ "alices_pub" ] = pubkey;
                    titanlib.state[ state_id ][ "bobs_priv" ] = null;
                    titanlib.state[ state_id ][ "server_nostr_pubkey" ] = counterparty;
                    titanlib.state[ state_id ][ "relays" ] = relays;
                    titanlib.state[ state_id ][ "connector" ] = null;
                    titanlib.state[ state_id ][ "utxos" ] = [];
                    titanlib.state[ state_id ][ "past_utxos" ] = [];
                    titanlib.state[ state_id ][ "nostr_privkey" ] = super_nostr.getPrivkey();
                    titanlib.state[ state_id ][ "watchtower" ] = {}
                }
                var nostr_privkey = titanlib.state[ state_id ][ "nostr_privkey" ];
                var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                var relays = titanlib.state[ state_id ][ "relays" ];
                var counterparty = titanlib.state[ state_id ][ "server_nostr_pubkey" ];
                var listenFunction = async socket => {
                    var subId = super_nostr.bytesToHex( crypto.getRandomValues( new Uint8Array( 8 ) ) );
                    var filter  = {}
                    filter.authors = [ counterparty, nostr_pubkey ];
                    filter.kinds = [ 4 ];
                    filter[ "#p" ] = [ nostr_pubkey ];
                    filter.since = Math.floor( Date.now() / 1000 ) - 5;
                    var subscription = [ "REQ", subId, filter ];
                    socket.send( JSON.stringify( subscription ) );
                }
                var handleFunction = async message => {
                    var [ type, subId, event ] = JSON.parse( message.data );
                    if ( !event || event === true ) return;
                    event.content = await super_nostr.alt_decrypt( nostr_privkey, event.pubkey, event.content );
                    var content = JSON.parse( event.content );
                    titanlib.listeners[ content.msg_type ] = content;
                    console.log( content );
                }
                var connection = await super_nostr.newPermanentConnection( relays[ 0 ], listenFunction, handleFunction );

                if ( make_new_state ) {
                    var message = JSON.stringify({
                        msg_type: "init",
                        msg_value: {
                            alices_pub: pubkey,
                            state_id,
                        },
                    });

                    //send message
                    var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                    var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                    super_nostr.sendEvent( event, relays[ 0 ] );
                    var message = await titanlib.listenForReply( "init_reply" );
                    // console.log( `send the following message to the server (they can process it using titanlib.processMessage):` );
                    // console.log( message );
                    // var message = JSON.parse( prompt( `send the message in your console to the server and enter their reply` ) );

                    //process reply
                    if ( !message.msg_value.hasOwnProperty( "ack" ) || message.msg_value.ack !== true ) return alert( `error: ${JSON.stringify( reply.msg_value )}` );
                    titanlib.state[ state_id ][ "bobs_pub" ] = message.msg_value.bobs_pub;
                }
                return state_id;
            },
            runServer: async nwc_string => {
                titanlib.am_server = true;
                if ( nwc_string ) {
                    var nostr_privkey = titanlib.getPrivkey();
                    var nostr_pubkey = titanlib.getPubkey( nostr_privkey );
                    var relays = [ "ws://127.0.0.1:6969" ];
                    // var relays = [ "wss://nostrue.com" ];
                    titanlib.server_info[ "nostr_privkey" ] = nostr_privkey;
                    titanlib.server_info[ "nostr_pubkey" ] = nostr_pubkey;
                    titanlib.server_info[ "relays" ] = relays;
                    titanlib.server_info[ "utxos" ] = {};
                    titanlib.server_info[ "address" ] = tapscript.Address.fromScriptPubKey( [ 1, nostr_pubkey ], titanlib.network );
                    titanlib.server_info[ "nwc_string" ] = nwc_string;
                } else {
                    var nostr_privkey = titanlib.server_info[ "nostr_privkey" ];
                    var nostr_pubkey = titanlib.server_info[ "nostr_pubkey" ];
                    var relays = titanlib.server_info[ "relays" ];
                }
                //set up listener on nostr
                var listenFunction = async socket => {
                    var subId = super_nostr.bytesToHex( crypto.getRandomValues( new Uint8Array( 8 ) ) );
                    var filter  = {}
                    filter.kinds = [ 4 ];
                    filter[ "#p" ] = [ nostr_pubkey ];
                    filter.since = Math.floor( Date.now() / 1000 ) - 5;
                    var subscription = [ "REQ", subId, filter ];
                    socket.send( JSON.stringify( subscription ) );
                }
                var handleFunction = async message => {
                    var [ type, subId, event ] = JSON.parse( message.data );
                    if ( !event || event === true ) return;
                    event.content = await super_nostr.alt_decrypt( nostr_privkey, event.pubkey, event.content );
                    console.log( JSON.parse( event.content ) );
                    if ( JSON.parse( event.content ).msg_type === "receive_ln_part_two" || JSON.parse( event.content ).msg_type === "send_ln_part_two" ) {
                        titanlib.listeners[ JSON.parse( event.content ).msg_type ] = JSON.parse( event.content );
                        return;
                    }
                    titanlib.processMessage( JSON.parse( event.content ), event.pubkey, nostr_pubkey );
                }
                var connection = await super_nostr.newPermanentConnection( relays[ 0 ], listenFunction, handleFunction );
                return titanlib.convertPubkeyAndRelaysToNprofile( "nprofile", nostr_pubkey, relays );
            },
            isValidAddress: address => {
                try {
                    return !!tapscript.Address.decode( address ).script;
                } catch( e ) {return;}
                return;
            },
            getVin: ( txid, vout, amnt, addy, sequence = 0xffffffff - 2 ) => ({
                txid,
                vout,
                sequence,
                prevout: {
                    value: amnt,
                    scriptPubKey: titanlib.isValidAddress( addy ) ? tapscript.Address.toScriptPubKey( addy ) : addy,
                },
            }),
            getVout: ( amnt, addy ) => ({
                value: amnt,
                scriptPubKey: titanlib.isValidAddress( addy ) ? tapscript.Address.toScriptPubKey( addy ) : addy,
            }),
            getSwapScripts: ( state_id, pmthash ) => {
                var state = titanlib.state[ state_id ];
                var alices_pub = state.alices_pub;
                var bobs_pub = state.bobs_pub;
                return [
                    [ alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ],
                    [ "OP_SIZE", 32, "OP_EQUALVERIFY", "OP_SHA256", pmthash, "OP_EQUALVERIFY", alices_pub, "OP_CHECKSIGVERIFY", bobs_pub, "OP_CHECKSIG" ],
                ];
            },
            subSwapScript: ( state_id, pmthash ) => {
                var state = titanlib.state[ state_id ];
                var alices_pub = state.alices_pub;
                var bobs_pub = state.bobs_pub;
                return [
                    //change the 2026 to 8 for testing purposes
                    [ 2026, "OP_CHECKSEQUENCEVERIFY", "OP_DROP", alices_pub, "OP_CHECKSIG" ],
                    [ "OP_SIZE", 32, "OP_EQUALVERIFY", "OP_SHA256", pmthash, "OP_EQUALVERIFY", bobs_pub, "OP_CHECKSIG" ],
                ];
            },
            sendLN: async ( state_id, amount, invoice ) => {
                if ( amount < 1_500 ) return alert( 'that is too little -- send at least 1500 sats' );
                if ( amount > 10_000 ) return alert( 'that is too much -- send at most 10,000 sats' );

                //prepare requisite variables
                var state = titanlib.state[ state_id ];
                var alices_priv = state.alices_priv;
                var alices_pub = state.alices_pub;
                var bobs_pub = state.bobs_pub;
                var make_connector = !state.connector_txid;
                var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                var alices_utxo = state.utxos[ 0 ];
                var txfee = 500;
                var txfee_rate = balance.feerates[ 1 ];

                //enter what amount you want to receive
                if ( !amount ) amount = Number( prompt( `enter the amount of sats you want to send` ) );
                if ( !amount ) return;

                //extract the payment hash from the invoice, if possible
                //otherwise, make a preimage and derive its payment hash
                if ( invoice ) {
                    var pmthash = brick_wallet.getInvoicePmthash( invoice );
                } else {
                    var preimage = titanlib.getPrivkey();
                    console.log( 'preimage server gets upon paying the invoice:' );
                    console.log( preimage );
                    var pmthash = await titanlib.sha256( titanlib.hexToBytes( preimage ) );
                }

                //get swap data
                var txs = titanlib.getSendTxData( state_id, amount, pmthash, alices_utxo, txfee, txfee_rate );
                var { funding_tx, cut_through_tx, alices_new_exit_tx, swap_scripts, swap_addy, swap_tree, swap_cblock, multisig_scripts, multisig_addy, multisig_tree, multisig_cblock } = txs;

                //sign the funding tx and the cut_through tx
                var old_pmthash = await titanlib.sha256( titanlib.hexToBytes( alices_utxo.preimage ) );
                var old_swap_scripts = titanlib.getSwapScripts( state_id, old_pmthash );
                var [ _, old_swap_tree, old_swap_cblock ] = titanlib.getAddressData( old_swap_scripts, 0 );
                var alices_sig_on_funding_tx = tapscript.Signer.taproot.sign( alices_priv, funding_tx, 0, {extension: old_swap_tree[ 0 ]} ).hex;
                var alices_sig_on_cut_through_tx = tapscript.Signer.taproot.sign( alices_priv, cut_through_tx, 0, {extension: multisig_tree[ 0 ] }).hex;

                //give the server the pmthash, amount, and alice's sig on the funding tx
                var message = JSON.stringify({
                    msg_type: "send_ln_part_one",
                    msg_value: {
                        state_id,
                        amount,
                        pmthash,
                        txfee,
                        txfee_rate,
                        alices_sig_on_funding_tx,
                        invoice,
                    },
                });

                //send message
                var counterparty = state[ "server_nostr_pubkey" ];
                var nostr_privkey = state[ "nostr_privkey" ];
                var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                var relays = state[ "relays" ];
                var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                super_nostr.sendEvent( event, relays[ 0 ] );
                var message = await titanlib.listenForReply( "send_ln_part_one_reply" );
                // console.log( 'send this message to your counterparty:' );
                // console.log( message );
                // var message = JSON.parse( prompt( `send the message in your console to your counterparty and enter their reply` ) );

                //process counterparty's reply
                var bobs_sig_on_new_exit_tx = message.msg_value.bobs_sig_on_new_exit_tx;
                var preimage_provided = message.msg_value.preimage;
                var hash_provided = await titanlib.sha256( titanlib.hexToBytes( preimage_provided ) );
                var preimage_is_valid = hash_provided === pmthash;

                //validate counterparty's sig
                if ( bobs_sig_on_new_exit_tx.length !== 130 || !bobs_sig_on_new_exit_tx.endsWith( "82" ) ) return console.log( 'aborting because bob sent a sig of an invalid length' );
                var b_sig = bobs_sig_on_new_exit_tx.substring( 0, 128 );
                var sighash_on_new_exit_tx = tapscript.Signer.taproot.hash( alices_new_exit_tx, 0, {extension: multisig_tree[ 0 ], sigflag: 0x82} ).hex;
                var bobs_sig_is_valid = await nobleSecp256k1.schnorr.verify( b_sig, sighash_on_new_exit_tx, bobs_pub );
                if ( !bobs_sig_is_valid || !preimage_is_valid ) {
                    titanlib.exitUnilaterally( state_id );
                    console.log( 'time to force close, your counterparty sent an invalid sig or an invalid preimage' );
                    return;
                }

                //reply with your own signature
                var message = JSON.stringify({
                    msg_type: "send_ln_part_two",
                    msg_value: {
                        state_id,
                        alices_sig_on_cut_through_tx,
                    },
                });

                //send message
                var counterparty = titanlib.state[ state_id ][ "server_nostr_pubkey" ];
                var nostr_privkey = titanlib.state[ state_id ][ "nostr_privkey" ];
                var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                var relays = titanlib.state[ state_id ][ "relays" ];
                var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                super_nostr.sendEvent( event, relays[ 0 ] );
                // console.log( 'send this message to your counterparty:' );
                // console.log( message );

                //set up a watchtower for the funding_txid
                var funding_txid = tapscript.Tx.util.getTxid( funding_tx );
                var cut_through_txid = tapscript.Tx.util.getTxid( cut_through_tx );
                state.watchtower[ funding_txid ] = {
                    what_to_do: "sweep_the_swap_output_or_grab_its_preimage",
                    when_to_stop_watchtower: 6,
                    removal_txid: cut_through_txid,
                    my_sweep_data: {
                        txid: funding_tx,
                        vout: 0,
                        prevout: {
                            value: amount,
                            addy: swap_addy,
                        },
                        swap_scripts,
                        swap_tree,
                        swap_cblock,
                        //change the 2026 to 8 for testing purposes
                        blocks_to_wait: 8,
                    },
                }

                //watch to see if your counterparty broadcasts the cut-through tx, which they should do within a few seconds; if they do not, run titanlib.exitUnilaterally()
                //set a 30 second timer
                var timer = async () => {
                    await titanlib.waitSomeTime( 30_000 );
                    return "time is up";
                }
                var watcher = titanlib.watchForTxid( cut_through_txid, titanlib.blockchain );
                var time_is_up = await Promise.any( [ timer(), watcher ] );
                if ( time_is_up ) {
                    titanlib.exitUnilaterally( state_id );
                    return;
                }

                //move your old utxo data to past utxos, if necessary
                if ( state.utxos.length ) {
                    var past_utxo = JSON.parse( JSON.stringify( state.utxos[ 0 ] ) );
                    //TODO: write a function that removes old utxo data 10 blocks after the confirmation of whatever txid is given in remove_when_this_tx_has_ten_confs
                    past_utxo = { ...past_utxo, remove_when_this_tx_has_ten_confs: tapscript.Tx.util.getTxid( cut_through_tx ) };
                    //TODO: set up a listener that watches to see if the server initiates a race condition by broadcasting the past utxo's version of tx1; if so, foil his attempt using the past utxo's version of tx4
                    state.past_utxos.push( past_utxo );
                    state.utxos.pop();
                }

                //save the info on your new utxo
                state.utxos.push({
                    txid: tapscript.Tx.util.getTxid( cut_through_tx ),
                    vout: 1,
                    addy: multisig_addy,
                    amount: Number( cut_through_tx.vout[ 1 ].value ),
                    bobs_sig_on_new_exit_tx,
                    pmthash: "e0e77a507412b120f6ede61f62295b1a7b2ff19d3dcc8f7253e51663470c888e",
                    preimage: "a".repeat( 64 ),
                    alices_utxo,
                    txfee,
                    txfee_rate,
                });

                var old_balance = alices_utxo.amount + 330;
                var new_balance = cut_through_tx.vout[ 1 ].value + 330;
                var preimage = preimage_provided;
                var fees_paid = old_balance - amount - new_balance;
                var txid = tapscript.Tx.util.getTxid( cut_through_tx );
                return [ preimage, fees_paid, txid ];
            },
            getLnInvoice: async ( state_id, amount ) => {
                //prepare requisite variables
                var state = titanlib.state[ state_id ];
                var alices_priv = state.alices_priv;
                var alices_pub = state.alices_pub;
                var bobs_pub = state.bobs_pub;
                var make_connector = !state.connector_txid;
                var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                var alices_utxo = state.utxos[ 0 ];

                //enter what amount you want to receive
                if ( !amount ) amount = Number( prompt( `enter the amount of sats you want to receive` ) );
                amount = Number( amount );
                if ( !amount ) return;

                //prepare request
                var message = JSON.stringify({
                    msg_type: "receive_ln_part_one",
                    msg_value: {
                        state_id,
                        amount,
                    },
                });

                //send message
                var counterparty = state[ "server_nostr_pubkey" ];
                var nostr_privkey = state[ "nostr_privkey" ];
                var nostr_pubkey = super_nostr.getPubkey( nostr_privkey );
                var relays = titanlib.state[ state_id ][ "relays" ];
                var emsg = await super_nostr.alt_encrypt( nostr_privkey, counterparty, message );
                var event = await super_nostr.prepEvent( nostr_privkey, emsg, 4, [ [ "p", counterparty ] ] );
                super_nostr.sendEvent( event, relays[ 0 ] );
                var message = await titanlib.listenForReply( "receive_ln_part_one_reply" );
                // console.log( 'send this message to your counterparty:' );
                // console.log( message );
                // var message = JSON.parse( prompt( `send the message in your console to your counterparty and enter their reply` ) );

                //process the reply
                if ( message.msg_value.hasOwnProperty( "error" ) ) {
                    showModal( `aborting because you got this error message: ${JSON.stringify( message.msg_value.error )}` );
                    return alert( `aborting because you got this error message: ${JSON.stringify( message.msg_value.error )}` );
                }
                var invoice = message.msg_value.invoice;
                if ( !invoice.startsWith( "ln" ) ) {
                    showModal( 'aborting because something went wrong and the server did not return a lightning invoice' );
                    return alert( 'aborting because something went wrong and the server did not return a lightning invoice' );
                }
                var pmthash = brick_wallet.getInvoicePmthash( invoice );
                var { bobs_sig_on_tx3, bobs_sig_on_tx4, utxos, txfee_rate } = message.msg_value;
                //use the mempool to ensure the txfee_rate is reasonable
                var actual_txfee_rate = balance.feerates[ 1 ];
                var difference = Math.abs( actual_txfee_rate - txfee_rate );
                //if the feerate is over 5 sats per byte, do not allow a difference of more than 50%
                if ( actual_txfee_rate > 5 && ( ( difference / actual_txfee_rate ) * 100 ) > 50 ) {
                    showModal( `aborting because something went wrong; the server tried to use a feerate of ${txfee_rate} sats per byte when the real feerate is ${actual_txfee_rate} sats per byte` );
                    return alert( `aborting because something went wrong; the server tried to use a feerate of ${txfee_rate} sats per byte when the real feerate is ${actual_txfee_rate} sats per byte` );
                }
                //if the feerate is over 10 sats per byte, do not allow a difference of more than 10%
                if ( actual_txfee_rate > 10 && ( ( difference / actual_txfee_rate ) * 100 ) > 10 ) {

            getSendTxData: ( state_id, amount, pmthash, alices_utxo, txfee, txfee_rate ) => {

                        titanlib.getVout( amount, swap_addy ),
                        titanlib.getVout( alices_utxo.amount + 330 - amount - txfee, alices_address ),
                    ],
                });

                //calculate a better fee estimate
                funding_tx.vin[ 0 ].witness = [
                    //add a 65 byte sig to the first input
                    "ab".repeat( 65 ),
                    //and a 64 byte sig
                    "ab".repeat( 64 ),
                    //and a 68 byte script
                    "ab".repeat( 68 ),
                    //and a 33 byte cblock if Alice sent last, otherwise add a 65 byte cblock
                    alices_utxo.hasOwnProperty( "alices_utxo" ) ? "ab".repeat( 33 ) : "ab".repeat( 65 ),

                //add a 64 byte sig to the second input
                funding_tx.vin[ 1 ].witness = [ "ab".repeat( 64 ) ];
                var vsize = tapscript.Tx.util.getTxSize( funding_tx ).vsize;
                var new_txfee = vsize * txfee_rate;
                funding_tx.vout[ 1 ].value = alices_utxo.amount + 330 - amount - new_txfee;
                funding_tx.vin[ 0 ].witness = [];
                funding_tx.vin[ 1 ].witness = [];

                //prepare cut through tx
                var cut_through_tx = tapscript.Tx.create({

                    "ab".repeat( 65 ),
                    //and a 64 byte sig
                    "ab".repeat( 64 ),
                    //and a 68 byte script
                    "ab".repeat( 68 ),

                    alices_utxo.hasOwnProperty( "alices_utxo" ) ? "ab".repeat( 33 ) : "ab".repeat( 65 ),

                var vsize = tapscript.Tx.util.getTxSize( cut_through_tx ).vsize;
                var new_txfee = vsize * txfee_rate;
                cut_through_tx.vout[ 1 ].value = alices_utxo.amount - amount - new_txfee;

                //prepare alice's new exit tx

            getReceiveTxData: ( state_id, amount, pmthash, utxos, make_connector, txfee, txfee_rate ) => {
                //prepare requisite variables
                var state = titanlib.state[ state_id ];
                var alices_pub = state.alices_pub;
                var bobs_pub = state.bobs_pub;
                var alices_address = tapscript.Address.fromScriptPubKey( [ 1, alices_pub ], titanlib.network );
                var bobs_nostr_pub = state[ "server_nostr_pubkey" ];
                var bobs_address = tapscript.Address.fromScriptPubKey( [ 1, bobs_nostr_pub ], titanlib.network );
                var connector_txid = null;
                if ( state.connector_txid ) connector_txid = state.connector_txid;

                //prepare papa swap script
                var swap_scripts = titanlib.getSwapScripts( state_id, pmthash );
                var [ swap_addy, swap_tree, swap_cblock ] = titanlib.getAddressData( swap_scripts, 1 );

                //prepare the inputs for tx0
                var vin = [];
                var sum = 0;
                utxos.forEach( utxo => {
                    sum = sum + utxo.amnt;
                    vin.push( titanlib.getVin( utxo.txid, utxo.vout, utxo.amnt, utxo.addy ) );
                });
                var amnt_for_change_addy = sum - txfee;

                //prepare the outputs for tx0
                var vout = [];
                if ( make_connector ) {
                    vout.push( titanlib.getVout( 330, alices_address ) );
                    amnt_for_change_addy = amnt_for_change_addy - 330;
                }
                vout.unshift( titanlib.getVout( amount, swap_addy ) );
                var change_needed = false;
                if ( amnt_for_change_addy - amount > 330 ) {
                    change_needed = true;
                    vout.push( titanlib.getVout( amnt_for_change_addy - amount, bobs_address ) );
                }

                //prepare tx0
                var tx0 = tapscript.Tx.create({
                    vin,
                    vout,
                });

                //calculate a better fee estimate
                tx0.vin.forEach( item => item.witness = [ "ab".repeat( 64 ) ] );
                if ( state.utxos.length ) {
                    var alices_utxo = state.utxos[ 0 ];
                    tx0.vin[ tx0.vin.length - 1 ].witness = [
                        //add a 65 byte sig to the first input
                        "ab".repeat( 65 ),
                        //and a 64 byte sig
                        "ab".repeat( 64 ),
                        //and a 68 byte script
                        "ab".repeat( 68 ),
                        //and a 33 byte cblock if Alice sent last, otherwise add a 65 byte cblock
                        alices_utxo.hasOwnProperty( "alices_utxo" ) ? "ab".repeat( 33 ) : "ab".repeat( 65 ),
                    ];
                }
                var vsize = tapscript.Tx.util.getTxSize( tx0 ).vsize;
                var new_txfee = vsize * txfee_rate;
                if ( change_needed ) tx0.vout[ make_connector ? 2 : 1 ].value = sum - amount - new_txfee;
                if ( change_needed && make_connector ) tx0.vout[ 2 ].value = sum - 330 - amount - new_txfee;
                if ( change_needed && sum - 330 - amount - new_txfee < 330 ) tx0.vout.length = tx0.vout.length - 1;
                tx0.vin[ 0 ].witness = [];
                if ( tx0.vin[ 1 ] ) tx0.vin[ 1 ].witness = [];

                //calculate the difference between the expected feerate and the actual feerate
                var difference = Math.abs( new_txfee - txfee );

                //correct the output values of tx0
                tx0.vout[ 0 ].value = tx0.vout[ 0 ].value + difference;
                if ( change_needed ) tx0.vout[ make_connector ? 2 : 1 ].value = tx0.vout[ make_connector ? 2 : 1 ].value - difference;

                //prepare tx1
                var tx0_txid = tapscript.Tx.util.getTxid( tx0 );
                var tx1 = tapscript.Tx.create({
                    version: 3,
                    vin: [
                        titanlib.getVin( tx0_txid, 0, amount, swap_addy ),
                    ],
                    vout: [
                        titanlib.getVout( amount, swap_addy ),
                        titanlib.getVout( 0, "51024e73" ),
                    ],
                });

                //prepare tx2
                var tx1_txid = tapscript.Tx.util.getTxid( tx1 );
                var tx2 = tapscript.Tx.create({
                    vin: [
                        //change the 2016 to 6 for testing purposes
                        titanlib.getVin( tx1_txid, 0, amount, swap_addy, 2016 ),
                    ],
                    vout: [
                        titanlib.getVout( amount, bobs_address ),
                    ],
                });

                //prepare connector txid, if necessary
                if ( make_connector ) {
                    var connector_tx = tapscript.Tx.create({
                        version: 3,
                        vin: [
                            titanlib.getVin( tx0_txid, 1, 330, alices_address ),
                        ],
                        vout: [
                            titanlib.getVout( 330, alices_address ),
                            titanlib.getVout( 0, "51024e73" ),
                        ],
                    });
                    connector_txid = tapscript.Tx.util.getTxid( connector_tx );
                }

                //prepare tx3
                var tx3 = tapscript.Tx.create({
                    version: 3,
                    vin: [
                        //change the 2026 to 8 for testing purposes
                        titanlib.getVin( connector_txid, 0, 330, alices_address, 8 ),
                        titanlib.getVin( tx0_txid, 0, amount, swap_addy ),
                    ],
                    vout: [
                        titanlib.getVout( amount, alices_address ),
                        titanlib.getVout( 0, "51024e73" ),
                    ],
                });

                //prepare tx4
                var tx4 = tapscript.Tx.create({
                    vin: [
                        titanlib.getVin( tx1_txid, 0, amount, swap_addy ),
                    ],
                    vout: [
                        titanlib.getVout( amount, alices_address ),
                    ],
                });

                return { tx0, tx1, tx2, tx3, tx4, swap_scripts, swap_addy, swap_tree, swap_cblock, new_txfee };
            },

                function inner_get( url ) {
                    var xhttp = new XMLHttpRequest();
                    xhttp.open( "GET", url, true );
                    xhttp.send();
                    return xhttp;
                }
                var data = inner_get( url );
                data.onerror = function( e ) {

                async function isResponseReady() {

                        titanlib.server_info.utxos = {}
                        utxos.forEach( utxo => {
                            var utxo_id = "s_" + utxo.txid + "_" + String( utxo.vout );
                            titanlib.server_info.utxos[ utxo_id ] = {
                                utxo_id,
                                ...utxo,
                            }
                        });
                        var bal = 0;
                        Object.keys( titanlib.server_info.utxos ).forEach( item => bal = bal + titanlib.server_info.utxos[ item ].amnt );
                        $( '.server_balance' ).innerText = bal.toLocaleString();
                        await titanlib.waitSomeTime( 10_000 );
                        balanceLoop();
                    }
                    balanceLoop();
                }, 100 );
            } else {
                var nostr_privkey = titanlib.server_info[ "nostr_privkey" ];
                var nostr_pubkey = titanlib.server_info[ "nostr_pubkey" ];
                var deposit_addy = tapscript.Address.fromScriptPubKey( [ 1, nostr_pubkey ], titanlib.network );
                var relays = titanlib.server_info[ "relays" ];
                var server_nprofile = titanlib.convertPubkeyAndRelaysToNprofile( "nprofile", nostr_pubkey, relays );
                titanlib.runServer();
                $( 'body' ).style = "word-wrap: break-word;";
                $( 'body' ).innerHTML = `<p>Thank you for running a papa swap server. Your nprofile is:</p><p>${server_nprofile}</p><p>Deposit funds here:</p><p class="deposit_addy"></p>${deposit_addy}<p><p>Balance:</p><p><span class="server_balance">0</span> sats</p><hr>This is your private key:</p><p class="nostr_privkey">${nostr_privkey}</p><p>You can use faucet_generator to manage your funds:</p><p>https://supertestnet.github.io/faucet_generator/</p><p>Remember: this is for science only! If you put money on this server you are almost guaranteed to lose it. It's just demo code, not production ready.</p>`;
                var balanceLoop = async () => {
                    var utxos = await titanlib.getUTXOs( nostr_privkey, titanlib.blockchain );
                    titanlib.server_info.utxos = {}
                    utxos.forEach( utxo => {
                        var utxo_id = "s_" + utxo.txid + "_" + String( utxo.vout );
                        titanlib.server_info.utxos[ utxo_id ] = {
                            utxo_id,
                            ...utxo,
                        }
                    });
                    var bal = 0;
                    Object.keys( titanlib.server_info.utxos ).forEach( item => bal = bal + titanlib.server_info.utxos[ item ].amnt );
                    $( '.server_balance' ).innerText = bal.toLocaleString();
                    await titanlib.waitSomeTime( 10_000 );
                    balanceLoop();
                }
                balanceLoop();
            }
            balance.getPrice( titanlib.blockchain );
        } else {
            //local storage and initialization
            if ( localStorage[ "brick_wallet_state" ] ) brick_wallet.state = JSON.parse( localStorage[ "brick_wallet_state" ] );
            if ( localStorage[ "titan_wallet_state" ] ) titanlib.state = JSON.parse( localStorage[ "titan_wallet_state" ] );
            var walletSaver = async () => {
                if ( stop_the_save ) {
                    window.location.reload();
                    return;
                } else {
                    localStorage[ "brick_wallet_state" ] = JSON.stringify( brick_wallet.state );
                    localStorage[ "titan_wallet_state" ] = JSON.stringify( titanlib.state );
                    await brick_wallet.waitSomeTime( 1000 );
                }
                walletSaver();
            }
            walletSaver();
            brick_wallet.state.offset = 0;
            if ( "selected_currencies" in brick_wallet.state && brick_wallet.state.selected_currencies.length ) balance.currencies = brick_wallet.state.selected_currencies;
            if ( "supported_currencies" in brick_wallet.state && brick_wallet.state.supported_currencies.length ) balance.supported_currencies = brick_wallet.state.supported_currencies;
            Object.keys( brick_wallet.state.history ).forEach( txid => {
                var tx = brick_wallet.state.history[ txid ];
                if ( !tx[ "detail_hidden" ] ) tx[ "detail_hidden" ] = true;
            });
            var getForex = async () => {
                var i; for ( i=0; i<balance.currencies.length; i++ ) {
                    var currency = balance.currencies[ i ];
                    if ( currency !== "sats" && currency !== "btc" && currency !== "usd" && !( currency in balance.forex ) ) {
                        var rate = await balance.getTicker( currency.toUpperCase() );
                        // console.log( `got rate for ${currency}: 1 usd = ${rate} ${currency}` );
                        balance.forex[ currency ] = rate;
                        await brick_wallet.waitSomeTime( 2000 );
                    }
                }
            }
            getForex();
            balance.getPrice( titanlib.blockchain );

            //load existing titanlib state
            setTimeout( async () => {
                var state_exists = false;
                Object.keys( titanlib.state ).forEach( item => {
                    if ( item.startsWith( "a" ) ) state_exists = true;
                });
                if ( state_exists ) {
                    titanlib.init();
                    var state_id = Object.keys( titanlib.state )[ 0 ];
                    titanlib.watchtower( state_id );
                    brick_wallet.init();
                    modalVanish();
                    return;
                }
                var url = window.location.protocol + "//" + window.location.hostname + window.location.pathname + "?server=true";
                var server_nprofile = prompt( `enter the server's nprofile. note that you can *run* a server by visiting this url: ${url}` );
                if ( server_nprofile && server_nprofile.startsWith( "nprofile1" ) ) {
                    var make_new_state = true;
                    titanlib.init( server_nprofile, make_new_state );
                }
                brick_wallet.init();
                modalVanish();
            }, 100 );
        }
    </script>
    <div class="black-bg hidden"></div>
    <div class="modal hidden"></div>
    <div class="toast"></div>
</body>
</html>
